model:
  model_path: artifacts/maple-preview
  tokenizer_path: data/maple-nemotron/tokenizer
  model_config:
    qat_ternary: true
    training_objective: causal
  ops_implementation:
    attn_implementation: flex_attention
    moe_implementation: fused_quack
    cross_entropy_loss_implementation: liger_kernel
    rms_norm_implementation: liger_kernel
    rotary_pos_emb_implementation: liger_kernel
    load_balancing_loss_implementation: eager

data:
  train_path: data/maple-nemotron/data
  data_type: tokenized
  datasets_type: iterable
  max_seq_len: 2048
  train_size: 1310720000

train:
  dyn_bsz: false
  accelerator:
    ulysses_size: 1
    ep_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
      reshard_after_forward: true
      reshard_after_backward: true
      mixed_precision:
        enable: true
        reduce_dtype: float32
  gradient_checkpointing:
    enable: true
    early_stop: false
  global_batch_size: 128
  micro_batch_size: 16
  optimizer:
    type: adamw
    lr: 1.0e-5
    weight_decay: 0.1
    lr_warmup_ratio: 0.002
    lr_decay_style: cosine
    max_grad_norm: 1.0
  num_train_epochs: 1
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  moe_load_balance_monitor_interval: 20
  checkpoint:
    output_dir: outputs/maple-ar-control
    manager: dcp
    save_steps: 500
    save_epochs: 0
    save_hf_weights: false
    keep_last_n: 2
  wandb:
    enable: true
    project: maple-bdlm
    name: maple-ar-control
